name: check-content

# Runs the OzarLand conventions checker (tools/check_content.py in the
# OzarLand/ozarland hub) that reviewers already run by hand, so outside pull
# requests get the same gate. It checks structure, metadata, links and
# sensitive data, not technical accuracy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The organization requires actions pinned to a full commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: runbooks
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: OzarLand/ozarland
          path: ozarland
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Content conventions, links and sensitive data
        run: python3 -I ozarland/tools/check_content.py --root runbooks
